<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>+Células | Login</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --green: #16a34a;
      --green-dark: #15803d;
      --text: #1f2937;
      --muted: #64748b;
      --line: #dbe3ee;
      --card: #ffffff;
      --red: #dc2626;
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.22);
      --radius: 22px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.20), transparent 32%),
        linear-gradient(135deg, var(--blue-dark), var(--green-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: var(--radius);
      padding: 34px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 26px;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--blue), var(--green));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 900;
      box-shadow: 0 12px 25px rgba(37,99,235,0.28);
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .intro {
      margin: 0 0 24px;
      color: #475569;
      font-size: 15px;
      line-height: 1.45;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-size: 15px;
      font-family: inherit;
      background: #fff;
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.14);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--blue), var(--green));
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(22,163,74,0.22);
    }

    button:hover {
      filter: brightness(0.97);
    }

    .login-seguro {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      font-weight: bold;
    }

    .msg {
      min-height: 22px;
      margin-top: 14px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      color: var(--red);
    }

    .rodape {
      margin-top: 18px;
      text-align: center;
      color: rgba(255,255,255,0.82);
      font-size: 13px;
      font-weight: bold;
    }

    @media (max-width: 520px) {
      .login-card {
        padding: 26px;
      }

      .brand h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">+C</div>
        <div>
          <h1>+Células</h1>
          <p>Gestão de células</p>
        </div>
      </div>

      <p class="intro">
        Acesse sua área para acompanhar membros, células, presença e relatórios ministeriais.
      </p>

      <form id="formLogin">
        <label for="usuario">Usuário</label>
        <input id="usuario" type="text" autocomplete="username" placeholder="Digite seu usuário" required />

        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required />

        <button id="btnEntrar" type="submit">Entrar</button>

        <p class="login-seguro">Acesso restrito aos usuários cadastrados.</p>
        <div id="msg" class="msg"></div>
      </form>
    </div>

    <div class="rodape">+Células • Sistema ministerial</div>
  </div>

  <script>
    const API_BASE = "";
    const API_LOGIN = API_BASE + "/login";

    const formLogin = document.getElementById("formLogin");
    const campoUsuario = document.getElementById("usuario");
    const campoSenha = document.getElementById("senha");
    const campoMsg = document.getElementById("msg");
    const btnEntrar = document.getElementById("btnEntrar");

    function mostrarMensagem(texto, cor = "#dc2626") {
      campoMsg.textContent = texto;
      campoMsg.style.color = cor;
    }

    function limparSessao() {
      sessionStorage.removeItem("celulasSessao");
      localStorage.removeItem("logado");
      localStorage.removeItem("usuario");
      localStorage.removeItem("nomeUsuario");
      localStorage.removeItem("nivelUsuario");
      localStorage.removeItem("usuarioId");
      localStorage.removeItem("celulaUsuario");
    }

    function salvarSessao(usuario) {
      const celulaVinculada = (
        usuario.celula ||
        usuario.celula_usuario ||
        usuario.celulaVinculada ||
        usuario.celula_vinculada ||
        ""
      );

      localStorage.setItem("logado", "sim");
      localStorage.setItem("usuario", usuario.usuario || campoUsuario.value.trim().toLowerCase());
      localStorage.setItem("nomeUsuario", usuario.nome || usuario.usuario || campoUsuario.value.trim() || "Administrador");
      localStorage.setItem("nivelUsuario", String(usuario.nivel || "admin").toLowerCase());
      localStorage.setItem("usuarioId", usuario.id || "");
      localStorage.setItem("celulaUsuario", String(celulaVinculada || "").trim());
    }

    async function entrar(evento) {
      evento.preventDefault();

      const usuario = campoUsuario.value.trim().toLowerCase();
      const senha = campoSenha.value.trim();

      if (!usuario || !senha) {
        mostrarMensagem("Informe usuário e senha.");
        return;
      }

      try {
        btnEntrar.disabled = true;
        btnEntrar.textContent = "Entrando...";
        mostrarMensagem("Validando acesso...", "#2563eb");

        const resposta = await fetch(API_LOGIN, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ usuario, senha })
        });

        const dados = await resposta.json().catch(() => ({}));

        if (!resposta.ok || dados.sucesso === false) {
          limparSessao();
          throw new Error(dados.erro || "Usuário ou senha inválidos.");
        }

        const usuarioLogado = dados.usuario || dados;
        salvarSessao(usuarioLogado);
        if (dados.token) sessionStorage.setItem("celulasSessao", dados.token);

        mostrarMensagem("Acesso liberado. Redirecionando...", "#16a34a");
        window.location.href = "painel.html";
      } catch (erro) {
        mostrarMensagem(erro.message || "Erro ao entrar no sistema.");
      } finally {
        btnEntrar.disabled = false;
        btnEntrar.textContent = "Entrar";
      }
    }

    limparSessao();
    formLogin.addEventListener("submit", entrar);
  </script>
</body>
</html>
